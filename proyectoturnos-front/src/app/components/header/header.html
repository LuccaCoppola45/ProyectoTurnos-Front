<header class="site-header">
  <a class="brand" href="#" aria-label="Turnia, inicio">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 32 32" fill="none">
        <rect x="4" y="6" width="24" height="22" rx="7" fill="currentColor" />
        <path d="M11 4v5m10-5v5M9 13h14M12 18h3m3 0h3m-9 5h3" stroke="#fff" stroke-width="2" stroke-linecap="round" />
      </svg>
    </span>
    <span>turnia<span class="brand-period">.</span></span>
  </a>

  <nav class="main-nav" aria-label="Navegación principal">
    <a href="#explorar">Explorar</a>
    <a href="#como-funciona">Cómo funciona</a>
  </nav>

  @if (authService.isAuthenticated()) {
    <button class="header-cta" type="button" (click)="authService.logout()">Cerrar sesión</button>
  } @else {
    <a class="header-cta" href="#acceso">Iniciar sesión <span aria-hidden="true">↗</span></a>
  }
</header>
